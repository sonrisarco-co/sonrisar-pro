{% extends "core/base.html" %}
{% block content %}

<h1>Agregar Rayos X / Fotografías</h1>
<h3>{{ paciente.nombre }} {{ paciente.apellido }}</h3>

<form method="post" enctype="multipart/form-data" id="rayosUploadForm">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url|default:'' }}">

    <div>
        <label>Imagen</label><br>
        {{ form.imagen }}
        {% if form.imagen.errors %}
            <div class="text-danger small mt-1">{{ form.imagen.errors }}</div>
        {% endif %}
    </div>

    <div>
        <label>Descripción</label><br>
        {{ form.descripcion }}
    </div>

    <br>

    <button type="submit" class="btn-sonrisar btn-primario">
        💾 Guardar
    </button>

    <a href="{% url 'rayos_x_list' paciente.id %}{% if next_url %}?next={{ next_url|urlencode }}{% endif %}"
       class="btn-sonrisar btn-volver">
       ⬅ Volver
    </a>
</form>


<script>
document.getElementById("rayosUploadForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const button = form.querySelector('button[type="submit"]');
    const csrfToken = form.querySelector('[name="csrfmiddlewaretoken"]').value;
    const imageInput = form.querySelector('input[type="file"][name="imagen"]');

    if (!imageInput || !imageInput.files.length) {
        alert("Seleccioná una imagen antes de guardar.");
        return;
    }

    const formData = new FormData(form);
    const imageFile = imageInput.files[0];
    formData.set("imagen", imageFile, imageFile.name);

    button.disabled = true;
    button.textContent = "Guardando…";

    try {
        const response = await fetch(window.location.href, {
            method: "POST",
            headers: { "X-CSRFToken": csrfToken },
            body: formData,
            credentials: "same-origin"
        });

        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
    } catch (error) {
        button.disabled = false;
        button.textContent = "💾 Guardar";
        alert("No se pudo subir la imagen. Revisá la conexión e intentá nuevamente.");
    }
});
</script>

{% endblock %}
